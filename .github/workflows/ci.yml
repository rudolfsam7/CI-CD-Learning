name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cicd-demo-app

jobs:
  build-scan-push:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Python dependencies
      - name: Install dependencies
        working-directory: ./cicd-demo-app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run unit tests
      - name: Run tests
        working-directory: ./cicd-demo-app
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            ./cicd-demo-app

      # 6. Trivy security scan
      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      # 7. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Push Docker image to GHCR
      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}

      # 9. Also tag image as latest
      - name: Tag image as latest
        run: |
          docker tag \
            $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            $REGISTRY/$IMAGE_NAME:latest

      # 10. Push latest tag
      - name: Push latest image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:latest
